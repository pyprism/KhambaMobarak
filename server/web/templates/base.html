{{ define "themeInit" }}
    <script>
        (function () {
            try {
                var pref = localStorage.getItem('theme') || 'auto';
                var resolved = pref === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
                document.documentElement.dataset.bsTheme = resolved;
            } catch (e) {}
        })();
    </script>
{{ end }}

{{ define "styles" }}
    <style>
		@font-face { font-family: bootstrap-icons; src: url('/static/bootstrap-icons.woff2') format('woff2'); }
        /* Scoped to light so it doesn't out-cascade Bootstrap's own dark
           --bs-body-bg (same specificity, this file loads later) and leave
           a light-gray page behind dark cards/navbar. */
        :root:not([data-bs-theme="dark"]) {
            --bs-body-bg: #f8f9fa;
        }
        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .navbar-brand img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            object-fit: contain;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .stat-card {
            border-left: 4px solid;
        }
        .stat-card.primary { border-left-color: #0d6efd; }
        .stat-card.success { border-left-color: #198754; }
        .stat-card.danger { border-left-color: #dc3545; }
        .device-card {
            position: relative;
            overflow: hidden;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online {
            background-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.3);
            animation: pulse 2s infinite;
        }
        .status-offline {
            background-color: #dc3545;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(25, 135, 84, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
        }
        .outage-item {
            border-left: 3px solid #dc3545;
            padding-left: 15px;
            margin-bottom: 15px;
        }
        .outage-item.ongoing {
            border-left-color: #ffc107;
            background-color: var(--bs-warning-bg-subtle);
            color: var(--bs-warning-text-emphasis);
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }
        .power-list-scroll {
            max-height: 320px;
            overflow-y: auto;
        }
        .time-ago {
            color: var(--bs-secondary-color);
            font-size: 0.875rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--bs-secondary-color);
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
{{ end }}

{{ define "scripts" }}
    <script src="/static/bootstrap.bundle.min.js"></script>
    <script>
        // Theme: light / dark / auto (system preference), cycled by the navbar
        // button. The actual dataset.bsTheme was already set synchronously in
        // <head> (see "themeInit") to avoid a flash of the wrong theme; this
        // wires up the toggle and keeps "auto" live against OS changes.
        const THEME_ICON = { light: '☀', dark: '☾', auto: '◐' };
        function resolveTheme(pref) {
            return pref === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : pref;
        }
        function applyTheme(pref) {
            const resolved = resolveTheme(pref);
            document.documentElement.dataset.bsTheme = resolved;
            const btn = document.getElementById('themeToggle');
            if (btn) {
                btn.textContent = THEME_ICON[pref] || THEME_ICON.auto;
                btn.setAttribute('aria-label', 'Theme: ' + pref + ' (click to change)');
            }
            document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: resolved } }));
        }
        let themePref = localStorage.getItem('theme') || 'auto';
        applyTheme(themePref);
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (themePref === 'auto') applyTheme('auto');
        });
        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const order = ['light', 'dark', 'auto'];
            themePref = order[(order.indexOf(themePref) + 1) % order.length];
            localStorage.setItem('theme', themePref);
            applyTheme(themePref);
        });
        // Auto-refresh every 30 seconds, but not while the user has an open
        // form (add/edit device, maintenance) or a just-created device token
        // on screen — reloading then would silently discard unsaved input or
        // the one-time token before they've copied it.
        function reloadUnlessBusy() {
            const busy = document.querySelector('.collapse.show') ||
                (document.getElementById('newDeviceToken')?.style.display === 'block') ||
                ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
            if (busy) {
                setTimeout(reloadUnlessBusy, 5000);
                return;
            }
            location.reload();
        }
        setTimeout(reloadUnlessBusy, 30000);

        // Format relative time (expects ISO 8601 string)
        function timeAgo(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; // fallback to raw string
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 5)   return 'just now';
            if (seconds < 60)  return seconds + 's ago';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                return h + 'h ' + (m > 0 ? m + 'm ' : '') + 'ago';
            }
            const days = Math.floor(seconds / 86400);
            return days === 1 ? '1 day ago' : days + ' days ago';
        }

        // Format duration from nanoseconds
        function formatDuration(nanoseconds) {
            if (isNaN(nanoseconds) || nanoseconds <= 0) return '—';
            const seconds = Math.floor(nanoseconds / 1000000000);
            if (seconds < 60) return seconds + 's';
            if (seconds < 3600) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return m + 'm' + (s > 0 ? ' ' + s + 's' : '');
            }
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return hours + 'h ' + (mins > 0 ? mins + 'm' : '');
        }

        // Update all time elements
        document.querySelectorAll('[data-time]').forEach(el => {
            el.textContent = timeAgo(el.dataset.time);
        });

        document.querySelectorAll('[data-duration]').forEach(el => {
            el.textContent = formatDuration(parseInt(el.dataset.duration));
        });
    </script>
{{ end }}
