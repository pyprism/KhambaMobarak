{{ define "styles" }}
    <style>
        :root {
            --bs-body-bg: #f8f9fa;
        }
        html, body {
            height: 100%;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .navbar-brand img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            object-fit: contain;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        }
        .stat-card {
            border-left: 4px solid;
        }
        .stat-card.primary { border-left-color: #0d6efd; }
        .stat-card.success { border-left-color: #198754; }
        .stat-card.danger { border-left-color: #dc3545; }
        .device-card {
            position: relative;
            overflow: hidden;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online {
            background-color: #198754;
            box-shadow: 0 0 0 3px rgba(25, 135, 84, 0.3);
            animation: pulse 2s infinite;
        }
        .status-offline {
            background-color: #dc3545;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(25, 135, 84, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 135, 84, 0); }
        }
        .outage-item {
            border-left: 3px solid #dc3545;
            padding-left: 15px;
            margin-bottom: 15px;
        }
        .outage-item.ongoing {
            border-left-color: #ffc107;
            background-color: #fff3cd;
            padding: 10px 15px;
            border-radius: 0 5px 5px 0;
        }
        .power-list-scroll {
            max-height: 320px;
            overflow-y: auto;
        }
        .time-ago {
            color: #6c757d;
            font-size: 0.875rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
{{ end }}

{{ define "navbar" }}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/static/icon.png" alt="Khamba Mobarak icon">Khamba Mobarak
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
{{ end }}

{{ define "footer" }}
    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center">
            <small><a href="https://github.com/pyprism/KhambaMobarak">Khamba Mobarak </a> - Power Outage Monitor</small>
        </div>
    </footer>
{{ end }}

{{ define "scripts" }}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Auto-refresh every 30 seconds
        setTimeout(function() {
            location.reload();
        }, 30000);

        // Format relative time (expects ISO 8601 string)
        function timeAgo(dateString) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString; // fallback to raw string
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);

            if (seconds < 5)   return 'just now';
            if (seconds < 60)  return seconds + 's ago';
            if (seconds < 3600) return Math.floor(seconds / 60) + ' min ago';
            if (seconds < 86400) {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                return h + 'h ' + (m > 0 ? m + 'm ' : '') + 'ago';
            }
            const days = Math.floor(seconds / 86400);
            return days === 1 ? '1 day ago' : days + ' days ago';
        }

        // Format duration from nanoseconds
        function formatDuration(nanoseconds) {
            if (isNaN(nanoseconds) || nanoseconds <= 0) return '—';
            const seconds = Math.floor(nanoseconds / 1000000000);
            if (seconds < 60) return seconds + 's';
            if (seconds < 3600) {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return m + 'm' + (s > 0 ? ' ' + s + 's' : '');
            }
            const hours = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            return hours + 'h ' + (mins > 0 ? mins + 'm' : '');
        }

        // Update all time elements
        document.querySelectorAll('[data-time]').forEach(el => {
            el.textContent = timeAgo(el.dataset.time);
        });

        document.querySelectorAll('[data-duration]').forEach(el => {
            el.textContent = formatDuration(parseInt(el.dataset.duration));
        });
    </script>
{{ end }}
