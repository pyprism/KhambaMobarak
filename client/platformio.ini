; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common settings for all environments
[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -D ARDUINOJSON_USE_LONG_LONG=1
    -Wall

; ==================== ESP8266 Boards ====================

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
board_build.filesystem = littlefs
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -D ESP8266

[env:d1_mini]
platform = espressif8266
board = d1_mini
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP8266

[env:esp12e]
platform = espressif8266
board = esp12e
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP8266

; ==================== ESP32 Boards ====================

[env:esp32dev]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP32

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP32
    ; DevKitM-1's core-defined LED_BUILTIN points at an addressable WS2812,
    ; which plain digitalWrite() blink can't drive; KHAMBA_LED_PIN lets us
    ; pick a different pin per env without colliding with the core's own
    ; (typed, non-macro) LED_BUILTIN definition. GPIO8 still won't produce a
    ; visible blink on the NeoPixel with this firmware's simple digitalWrite
    ; calls -- driving it properly needs a WS2812/NeoPixel library, which is
    ; out of scope here. Override to a free GPIO with a plain LED wired to it
    ; if you need working status blinks on this board.
    -D KHAMBA_LED_PIN=8

[env:esp32-s2-saola-1]
platform = espressif32
board = esp32-s2-saola-1
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP32
    ; Saola-1's onboard LED is on GPIO18, not the generic ESP32 default (GPIO2).
    -D KHAMBA_LED_PIN=18

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -D ESP32

